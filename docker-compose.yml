# ==============================================================================
# Docker Compose — Patente_web (Frontend React + Backend FastAPI em RAM)
# ==============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patente_web_backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost
    # Monta uma partição tmpfs em RAM (512MB) para conversões de PDF ultra-rápidas sem tocar em disco
    tmpfs:
      - /dev/shm:size=512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Quando vazio, o Nginx faz o proxy reverso automático de /api para o backend
        - VITE_API_URL=
    container_name: patente_web_frontend
    ports:
      # Mapeia a porta 5173 do seu computador para o container (basta abrir http://localhost:5173)
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
